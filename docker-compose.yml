services:
  mysql-db:
    image: mysql:8.0
    container_name: b3_mysql
    restart: always
    environment:
      MYSQL_DATABASE: b3_alerts
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: b3_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10

  motor-b3-app:
    build: .
    container_name: b3_spring_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Conexão com o Aiven (MySQL)
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      # Conexão com o CloudAMQP (RabbitMQ)
      # O Spring usa essa propriedade para ler URLs completas (amqps://)
      - SPRING_RABBITMQ_ADDRESSES=${RABBITMQ_URL}

      # APIs Externas
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - BRAPI_TOKEN=${BRAPI_TOKEN}

volumes:
  mysql_data: